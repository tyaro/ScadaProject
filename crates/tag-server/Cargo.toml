[package]
name = "tag-server"
version = "0.1.0"
edition = "2021"

[dependencies]
scada-core = { path = "../scada-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rumqttc = { version = "0.25.1", features = ["websocket"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time"] }

[lib]
path = "src/lib.rs"

[dev-dependencies]
driver-manager = { path = "../driver-manager" }
mock-driver = { path = "../mock-driver" }

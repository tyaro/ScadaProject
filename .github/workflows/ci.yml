name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      run_bind_tests:
        description: "Run bind-dependent checks and Runtime UI E2E"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_builder_ui_e2e:
        description: "Run Builder UI E2E"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_supervise_log_checks:
        description: "Run tauri-shell supervise log summary checks"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_tauri_shell_exhausted_restart_test:
        description: "Run tauri-shell exhausted-restart ignored test"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  standard:
    name: Standard Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        run: rustup update stable && rustup default stable

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/runtime-ui/package-lock.json
            apps/builder-ui/package-lock.json

      - name: Install Builder UI dependencies
        working-directory: apps/builder-ui
        run: npm ci

      - name: Install Runtime UI dependencies
        working-directory: apps/runtime-ui
        run: npm ci

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Run standard local CI checks
        env:
          RUN_SUPERVISE_LOG_CHECKS: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_supervise_log_checks == 'true' && '1' || '0') || '0' }}
        run: scripts/check_local_ci.sh

  bind-dependent:
    name: Bind-Dependent Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_bind_tests == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        run: rustup update stable && rustup default stable

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/runtime-ui/package-lock.json
            apps/builder-ui/package-lock.json

      - name: Install Builder UI dependencies
        working-directory: apps/builder-ui
        run: npm ci

      - name: Install Runtime UI dependencies
        working-directory: apps/runtime-ui
        run: npm ci

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Builder UI Playwright browser
        if: github.event_name == 'schedule' || inputs.run_builder_ui_e2e == 'true'
        working-directory: apps/builder-ui
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browser
        working-directory: apps/runtime-ui
        run: npx playwright install --with-deps chromium

      - name: Run bind-dependent local CI checks
        env:
          RUN_BIND_TESTS: "1"
          RUN_RUNTIME_UI_E2E: "1"
          RUN_BUILDER_UI_E2E: ${{ github.event_name == 'schedule' && '1' || (inputs.run_builder_ui_e2e == 'true' && '1' || '0') }}
          RUN_SUPERVISE_LOG_CHECKS: ${{ github.event_name == 'schedule' && '1' || (inputs.run_supervise_log_checks == 'true' && '1' || '0') }}
        run: scripts/check_local_ci.sh

      - name: Upload bind-dependent logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bind-dependent-logs
          path: |
            /tmp/preview-runtime-mqtt-resync.log
            /tmp/tag-server-mqtt-resync.log
            apps/runtime-ui/test-results
          if-no-files-found: ignore

  tauri-shell-exhausted-restart-monitor:
    name: Tauri Shell Exhausted-Restart Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_tauri_shell_exhausted_restart_test == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        run: rustup update stable && rustup default stable

      - name: Run exhausted-restart ignored test
        run: cargo test -p tauri-shell --test supervise_loop_reset supervise_loop_fails_when_restart_is_exhausted_with_fail_flag -- --ignored

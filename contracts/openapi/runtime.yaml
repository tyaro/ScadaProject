openapi: 3.0.3
info:
  title: SCADA Runtime API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Runtime health check
      responses:
        "200":
          description: Runtime is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  status:
                    type: string
                required:
                  - service
                  - status
  /api/v1/tags/snapshot:
    post:
      summary: Fetch latest tag snapshot for a screen or tag list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
                tag_ids:
                  type: array
                  items:
                    type: string
              required:
                - project_id
                - tag_ids
      responses:
        "200":
          description: Latest tag values
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: "../schemas/tag-value.schema.json"
                  missing_tag_ids:
                    type: array
                    items:
                      type: string
                required:
                  - values
                  - missing_tag_ids
        "400":
          description: Invalid snapshot request
        "401":
          description: Local API token is missing or invalid
  /api/v1/driver-values:
    post:
      summary: Ingest normalized driver values into the Tag Server cache
      description: Phase 0 internal endpoint used by Driver Manager until the gRPC boundary is implemented.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
                values:
                  type: array
                  items:
                    $ref: "../schemas/tag-value.schema.json"
              required:
                - project_id
                - values
      responses:
        "202":
          description: Driver values were accepted for latest-value cache ingestion
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: integer
                    minimum: 0
                  ingested:
                    type: integer
                    minimum: 0
                  stale:
                    type: integer
                    minimum: 0
                  published:
                    type: integer
                    minimum: 0
                required:
                  - received
                  - ingested
                  - stale
                  - published
        "400":
          description: Invalid driver value payload
        "401":
          description: Local API token is missing or invalid
        "502":
          description: Driver values were ingested, but MQTT publish failed
  /api/v1/control-commands:
    post:
      summary: Request a tag write/control command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/control-command.schema.json"
      responses:
        "202":
          description: Control command accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  command:
                    $ref: "../schemas/control-command.schema.json"
                  driver_request:
                    type: object
                    properties:
                      command_id:
                        type: string
                      tag_id:
                        type: string
                      value:
                        type: string
                    required:
                      - command_id
                      - tag_id
                      - value
                required:
                  - command
                  - driver_request
        "400":
          description: Invalid control command request
        "401":
          description: Local API token is missing or invalid
        "409":
          description: Control command rejected by write policy

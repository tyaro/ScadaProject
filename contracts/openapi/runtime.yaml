openapi: 3.0.3
info:
  title: SCADA Runtime API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Runtime health check
      responses:
        "200":
          $ref: "#/components/responses/HealthOk"
  /api/v1/tags/snapshot:
    post:
      summary: Fetch latest tag snapshot for a screen or tag list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagSnapshotRequest"
      responses:
        "200":
          $ref: "#/components/responses/TagSnapshotOk"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v1/screens/projection:
    post:
      summary: Fetch the current screen projection for the monitoring UI
      description: Runtime endpoint that loads a screen definition, fetches a REST snapshot from Tag Server, and returns object binding states for the client.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenProjectionRequest"
      responses:
        "200":
          $ref: "#/components/responses/ScreenProjectionOk"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "502":
          $ref: "#/components/responses/BadGatewayError"
  /api/v1/driver-values:
    post:
      summary: Ingest normalized driver values into the Tag Server cache
      description: Phase 0 internal endpoint used by Driver Manager until the gRPC boundary is implemented.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverValuesIngestRequest"
      responses:
        "202":
          $ref: "#/components/responses/DriverValuesAccepted"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "502":
          $ref: "#/components/responses/DriverValuesPublishFailed"
  /api/v1/control-commands:
    post:
      summary: Request a tag write/control command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/control-command.schema.json"
      responses:
        "202":
          $ref: "#/components/responses/ControlCommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "502":
          $ref: "#/components/responses/BadGatewayError"
  /api/v1/operation-logs:
    get:
      summary: Fetch recent control operation logs
      description: Phase 1 minimal operation-log endpoint backed by in-memory recent control command records (latest first, bounded capacity).
      responses:
        "200":
          $ref: "#/components/responses/OperationLogsOk"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

components:
  responses:
    HealthOk:
      description: Runtime is healthy
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    TagSnapshotOk:
      description: Latest tag values
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TagSnapshotResponse"
    ScreenProjectionOk:
      description: Current screen object projection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScreenProjectionResponse"
    DriverValuesAccepted:
      description: Driver values were accepted for latest-value cache ingestion
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DriverValuesIngestResponse"
    ControlCommandAccepted:
      description: Control command accepted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ControlCommandAcceptedResponse"
    OperationLogsOk:
      description: Recent operation logs
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationLogListResponse"
    BadRequestError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Local API token is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: Request conflicts with current state or policy
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGatewayError:
      description: Upstream forwarding failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DriverValuesPublishFailed:
      description: Driver values were ingested, but MQTT publish failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DriverValuesPublishFailureResponse"
  schemas:
    TagSnapshotRequest:
      type: object
      properties:
        project_id:
          type: string
        tag_ids:
          type: array
          items:
            type: string
      required:
        - project_id
        - tag_ids
    ScreenProjectionRequest:
      type: object
      properties:
        screen_path:
          type: string
          description: Local screen definition path used by the phase 1 preview runtime.
    DriverValuesIngestRequest:
      type: object
      properties:
        project_id:
          type: string
        values:
          type: array
          items:
            $ref: "../schemas/tag-value.schema.json"
      required:
        - project_id
        - values
    HealthResponse:
      type: object
      properties:
        service:
          type: string
        status:
          type: string
      required:
        - service
        - status
    TagSnapshotResponse:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: "../schemas/tag-value.schema.json"
        missing_tag_ids:
          type: array
          items:
            type: string
      required:
        - values
        - missing_tag_ids
    ObjectBindingState:
      type: object
      properties:
        key:
          type: string
        tag_id:
          type: string
        value: {}
        quality:
          type: string
          nullable: true
        sequence:
          type: integer
          nullable: true
      required:
        - key
        - tag_id
        - value
        - quality
        - sequence
    ScreenObjectState:
      type: object
      properties:
        object_id:
          type: string
        svg_asset_id:
          type: string
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/ObjectBindingState"
      required:
        - object_id
        - svg_asset_id
        - bindings
    ScreenProjectionResponse:
      type: object
      properties:
        screen_id:
          type: string
        project_id:
          type: string
        object_states:
          type: array
          items:
            $ref: "#/components/schemas/ScreenObjectState"
      required:
        - screen_id
        - project_id
        - object_states
    ControlCommandDriverRequest:
      type: object
      properties:
        command_id:
          type: string
        tag_id:
          type: string
        value:
          type: string
      required:
        - command_id
        - tag_id
        - value
    ControlCommandDriverResponse:
      type: object
      properties:
        command_id:
          type: string
        accepted:
          type: boolean
        message:
          type: string
      required:
        - command_id
        - accepted
        - message
    ControlCommandAcceptedResponse:
      type: object
      properties:
        command:
          $ref: "../schemas/control-command.schema.json"
        driver_request:
          $ref: "#/components/schemas/ControlCommandDriverRequest"
        driver_response:
          $ref: "#/components/schemas/ControlCommandDriverResponse"
      required:
        - command
        - driver_request
    OperationLogEntry:
      type: object
      properties:
        command_id:
          type: string
        user_id:
          type: string
        tag_id:
          type: string
        requested_value:
          type: string
        requested_at:
          type: string
        status:
          type: string
        result:
          type: string
      required:
        - command_id
        - user_id
        - tag_id
        - requested_value
        - requested_at
        - status
        - result
    OperationLogListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OperationLogEntry"
      required:
        - items
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    DriverValuesIngestResponse:
      type: object
      properties:
        received:
          type: integer
          minimum: 0
        ingested:
          type: integer
          minimum: 0
        stale:
          type: integer
          minimum: 0
        published:
          type: integer
          minimum: 0
      required:
        - received
        - ingested
        - stale
        - published
    DriverValuesPublishFailureResponse:
      allOf:
        - $ref: "#/components/schemas/DriverValuesIngestResponse"
        - type: object
          properties:
            publish_errors:
              type: array
              items:
                type: string
          required:
            - publish_errors
